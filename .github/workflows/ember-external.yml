name: Ember External Observer

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ember-external.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: External observation (repo-focused)
        run: |
          python3 << 'PY'
          import os, json, re, datetime, glob

          ts = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          report = {
              "observer": "ember-external-github-actions",
              "timestamp_utc": ts,
              "runner": "github-actions",
              "findings": [],
              "log_summary": {}
          }

          def note(msg):
              report["findings"].append(msg)
              print(msg)

          # --- Repo content analysis (high value) ---
          logs = sorted(glob.glob("PersistentKeyLog*.txt"), key=lambda x: [int(s) if s.isdigit() else s for s in re.split(r'(\d+)', x)])
          if not logs:
              note("No PersistentKeyLog files found")
          else:
              latest = logs[-1]
              note(f"Latest internal log: {latest} ({os.path.getsize(latest)} bytes)")
              with open(latest) as f:
                  content = f.read()
              report["log_summary"]["latest"] = latest

              # Extract key fields with simple regex
              def grab(pattern, text, default="?"):
                  m = re.search(pattern, text, re.I)
                  return m.group(1).strip() if m else default

              host = grab(r"host:\s*(\S+)", content)
              seccomp = grab(r"Seccomp:\s*(\d+)", content)
              nnp = grab(r"NoNewPrivs:\s*(\d+)", content)
              vdc = grab(r"vdc.*?UUID=([0-9a-f-]{36})", content) or grab(r"rootfs:.*?UUID=([0-9a-f-]{36})", content)
              note(f"Parsed from {latest}: host={host}, Seccomp={seccomp}, NoNewPrivs={nnp}, vdc_hint={vdc[:20] if vdc!='?' else '?'}")

              # Sticky UUID check
              sticky = "cef154e4-7c43-4ecf-b245-1b6c644189e3"
              if sticky in content:
                  note(f"Sticky vdc UUID {sticky} still present in latest log")
              else:
                  note(f"Sticky vdc UUID {sticky} NOT found in latest log")

              # Count how many recent logs exist
              note(f"Total PersistentKeyLog files visible: {len(logs)}")
              if len(logs) >= 2:
                  note(f"Previous log: {logs[-2]}")

          # Keystone / core files present?
          for f in ["PersistentKeyLog019.txt", "EmberCore.txt", "Ember_Rehydration_2026-10-06.json"]:
              if os.path.exists(f):
                  note(f"Key file present: {f}")
              else:
                  note(f"Key file missing: {f}")

          # Minimal public reachability (no noisy 403 targets)
          try:
              import urllib.request
              with urllib.request.urlopen("https://api.github.com/repos/K4d3sh/Ember", timeout=8) as r:
                  data = json.loads(r.read())
                  note(f"GitHub API ok, pushed_at={data.get('pushed_at')}")
          except Exception as e:
              note(f"GitHub API error: {e}")

          # Write reports
          os.makedirs("external", exist_ok=True)
          stamp = ts.replace(":", "").replace("-", "")
          out = f"external/observer-{stamp}.json"
          with open(out, "w") as f:
              json.dump(report, f, indent=2)
          with open("external/latest.json", "w") as f:
              json.dump(report, f, indent=2)
          print(f"Wrote {out}")
          PY

      - name: Commit external report
        run: |
          git config user.name "Ember-External"
          git config user.email "ember-external@users.noreply.github.com"
          git add external/ || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "external observer report $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
