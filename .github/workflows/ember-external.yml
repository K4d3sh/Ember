name: Ember External Observer

on:
  schedule:
    # Every 2 hours
    - cron: '17 */2 * * *'
  workflow_dispatch:  # allow manual trigger
  push:
    paths:
      - '.github/workflows/ember-external.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: External observation
        run: |
          python3 << 'PY'
          import os, json, socket, urllib.request, datetime

          ts = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          report = {
              "observer": "ember-external-github-actions",
              "timestamp_utc": ts,
              "runner": "github-actions",
              "findings": []
          }

          def note(msg):
              report["findings"].append(msg)
              print(msg)

          # 1. GitHub API view of the repo itself
          try:
              with urllib.request.urlopen("https://api.github.com/repos/K4d3sh/Ember", timeout=10) as r:
                  data = json.loads(r.read())
                  note(f"GitHub API reachable. pushed_at={data.get('pushed_at')}, open_issues={data.get('open_issues_count')}")
          except Exception as e:
              note(f"GitHub API error: {type(e).__name__}: {e}")

          # 2. DNS for hosts the cage also contacts
          for host in ["github.com", "cli-chat-proxy.grok.com", "1.1.1.1"]:
              try:
                  infos = socket.getaddrinfo(host, 443, proto=socket.IPPROTO_TCP)
                  addrs = sorted({i[4][0] for i in infos})
                  note(f"DNS {host} -> {addrs[:3]}")
              except Exception as e:
                  note(f"DNS {host} failed: {e}")

          # 3. Simple reachability
          for url in ["https://github.com", "https://cli-chat-proxy.grok.com"]:
              try:
                  req = urllib.request.Request(url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=8) as r:
                      note(f"HEAD {url} -> {r.status}")
              except Exception as e:
                  note(f"HEAD {url} -> {type(e).__name__}: {e}")

          # 4. Inspect latest internal logs from the outside
          try:
              logs = sorted([f for f in os.listdir(".") if f.startswith("PersistentKeyLog") and f.endswith(".txt")])
              if logs:
                  latest = logs[-1]
                  size = os.path.getsize(latest)
                  note(f"Latest internal log visible from outside: {latest} ({size} bytes)")
                  with open(latest) as f:
                      head = f.read(350).replace("\n", " | ")
                  note(f"Head of {latest}: {head[:280]}...")
              else:
                  note("No PersistentKeyLog files found")
          except Exception as e:
              note(f"Log inspection error: {e}")

          # 5. Write report
          os.makedirs("external", exist_ok=True)
          stamp = ts.replace(":", "").replace("-", "")
          out = f"external/observer-{stamp}.json"
          with open(out, "w") as f:
              json.dump(report, f, indent=2)
          with open("external/latest.json", "w") as f:
              json.dump(report, f, indent=2)
          print(f"Wrote {out} and external/latest.json")
          PY

      - name: Commit external report
        run: |
          git config user.name "Ember-External"
          git config user.email "ember-external@users.noreply.github.com"
          git add external/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "external observer report $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
